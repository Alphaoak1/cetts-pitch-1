events {}
http {
    server {
        listen 80;
        server_name _;
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
        }
        location /dashboard/ {
            alias /usr/share/nginx/html/dashboard/;
            index index.html;
        }
        location / {
            return 301 /dashboard/;
        }
    }
}